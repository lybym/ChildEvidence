# ChildEvidence research topics and discovery queries.
# Every query runs against official public APIs only.
# Filters follow OpenAlex filter syntax (title.search / from_publication_date / type).
# quota = per-domain promotion target for topic candidates (seeds are extra).

domains:
  child_development:
    quota: 26
    queries:
      - id: dev_ef_recent
        tags: [executive_function, cognitive_control]
        openalex:
          filter:
            title.search: executive function
            from_publication_date: "2018-01-01"
            type: article|review
