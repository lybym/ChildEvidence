[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "childevidence"
version = "0.1.0"
description = "ChildEvidence - children's development & education research evidence library (acquisition, evidence management, knowledge engineering infrastructure)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LumiThink / ChildEvidence maintainers" }]
dependencies = []  # standard library only by design

[project.optional-dependencies]
# CE-03 controlled PDF parsing (optional, isolated venv; see docs/parsing/README.md).
# docling pinned to the POC-validated baseline; never imported by the core CLI.
parsing = ["docling==2.138.0", "pdfplumber>=0.11,<0.12"]

[project.scripts]
research = "research_library.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_library = ["py.typed", "contracts/evidence/*.schema.json", "contracts/assets/*.schema.json", "contracts/assets/fixtures/*.json"]
